<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Apps | Jump Vault</title>
<meta name="description" content="Apps built by Jump Vault — free, accessible, and ready to use in your browser.">
<meta name="theme-color" content="#0F1420">
<style>
/* ── Tokens ───────────────────────────────────────────────────────────────
   Jump Vault palette, from src/theme.ts. Restyling means editing these,
   not hunting through the rules below.                                  */
:root{
  --bg:#0F1420; --card:#1A2130; --border:#28324A;
  --text:#EDF1F7; --dim:#8B96AC;
  --accent:#4C8DFF; --ok:#3DDC91; --warn:#FFB84C;
  --radius:14px; --gap:12px;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ── Masthead ─────────────────────────────────────────────────────────── */
.masthead{padding:28px 0 16px;}
.back{
  display:inline-block;font-size:13px;font-weight:600;text-decoration:none;
  color:var(--dim);border:1px solid var(--border);padding:6px 12px;
  border-radius:999px;margin-bottom:18px;
}
.back:hover{color:var(--text);border-color:var(--accent);}
h1{font-size:clamp(28px,8vw,38px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 8px;}
.lede{color:var(--dim);font-size:15px;margin:0;max-width:48ch;}

/* ── Sticky search ────────────────────────────────────────────────────── */
.searchbar{
  position:sticky;top:0;z-index:20;padding:12px 0;margin-bottom:4px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid transparent;transition:border-color .2s ease;
}
.searchbar[data-stuck]{border-bottom-color:var(--border);}
.field{position:relative;display:flex;align-items:center;}
.field>svg{position:absolute;left:14px;width:18px;height:18px;stroke:var(--dim);pointer-events:none;}
#q{
  width:100%;height:48px;padding:0 44px 0 42px;
  font:inherit;font-size:16px; /* 16px stops iOS zooming on focus */
  color:var(--text);background:var(--card);
  border:1px solid var(--border);border-radius:12px;
}
#q::placeholder{color:var(--dim);}
/* Chrome and Safari draw their own clear "x" on type=search. We ship our own
   (labelled, keyboard-reachable), so hide the native one or you get two. */
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration,
#q::-webkit-search-results-button,#q::-webkit-search-results-decoration{
  -webkit-appearance:none;appearance:none;display:none;
}
#q::-ms-clear{display:none;width:0;height:0;}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.25);}
.clear{
  position:absolute;right:6px;width:36px;height:36px;display:none;
  align-items:center;justify-content:center;background:none;border:0;
  border-radius:8px;color:var(--dim);font-size:20px;line-height:1;cursor:pointer;
}
.clear:hover{color:var(--text);}
.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#q:not(:placeholder-shown) ~ .clear{display:flex;}
.count{font-size:13px;color:var(--dim);margin:10px 2px 0;min-height:1em;}

/* ── Tile grid: two across, always ────────────────────────────────────── */
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--gap);margin:0;padding:0;list-style:none;
}
.tile{
  position:relative;display:flex;flex-direction:column;gap:8px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  content-visibility:auto;contain-intrinsic-size:auto 168px;
  transition:border-color .15s ease, transform .15s ease;
}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);}
.tile:focus-within{outline:3px solid var(--accent);outline-offset:2px;}
.chip{
  width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
  overflow:hidden;font-weight:800;font-size:17px;color:#0B1017;letter-spacing:-0.02em;
}
.chip img{width:100%;height:100%;object-fit:cover;}
.tile h2{font-size:15px;line-height:1.25;margin:0;letter-spacing:-0.01em;}
/* A button, not a link. Tiles open a sheet, so there is no URL for the
   browser to preview, offer in a long-press menu, or hand off to another
   app. That hand-off is why an external href felt like a prompt. */
.tile h2 button{
  font:inherit;font-weight:inherit;color:var(--text);text-align:left;
  background:none;border:0;padding:0;margin:0;cursor:pointer;
}
.tile h2 button::after{content:"";position:absolute;inset:0;} /* whole tile tappable */
.cat{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}
.desc{
  font-size:13px;color:var(--dim);margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.badge{margin-top:auto;font-size:11px;font-weight:600;color:var(--ok);
  display:inline-flex;align-items:center;gap:5px;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);}

/* ── Loading, empty, end states ───────────────────────────────────────── */
.sentinel{height:1px;}
.status{text-align:center;color:var(--dim);font-size:14px;padding:24px 0 0;}
.spinner{
  width:20px;height:20px;margin:0 auto;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:48px 16px;color:var(--dim);}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px;}

footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);
  color:var(--dim);font-size:13px;}
footer a{color:var(--accent);text-decoration:none;}

/* ── The expanding sheet ──────────────────────────────────────────────────
   A near-full-screen panel on phones with a strip of backdrop left at the
   top, so there is somewhere to tap to dismiss. Centred card on wider
   screens. Uses <dialog>, which gives Escape-to-close, focus trapping and
   top-layer stacking without reimplementing any of it.                  */
#sheet{
  position:fixed;inset:auto 0 0 0;margin:0 auto;
  width:100%;max-width:560px;max-height:92dvh;height:auto;
  padding:0;border:0;background:transparent;color:var(--text);overflow:visible;
}
#sheet::backdrop{background:rgba(4,8,14,.72);backdrop-filter:blur(3px);}
.sheet-inner{
  position:relative;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);border:1px solid var(--border);
  border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
}
.grabber{
  width:38px;height:4px;border-radius:999px;background:var(--border);
  margin:-6px auto 16px;
}
.sheet-close{
  position:absolute;top:12px;right:12px;width:40px;height:40px;
  display:grid;place-items:center;border-radius:10px;
  background:var(--bg);border:1px solid var(--border);color:var(--dim);
  font-size:22px;line-height:1;cursor:pointer;
}
.sheet-close:hover{color:var(--text);border-color:var(--accent);}
.sheet-close:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.sheet-head{display:flex;gap:14px;align-items:center;padding-right:52px;margin-bottom:16px;}
.chip-lg{width:64px;height:64px;border-radius:16px;font-size:24px;}
#sheet-title{font-size:22px;line-height:1.15;margin:2px 0 0;letter-spacing:-0.02em;}
.sheet-desc{color:var(--dim);font-size:15px;margin:0 0 20px;}
.sheet-actions{display:flex;flex-direction:column;gap:10px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  min-height:52px;padding:0 18px;border-radius:12px;
  font:inherit;font-size:16px;font-weight:600;text-decoration:none;
  border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;
}
.btn:hover{border-color:var(--accent);}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#08111F;}
.btn-primary:hover{filter:brightness(1.08);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn[disabled]:hover{border-color:var(--border);}
.sheet-note{
  font-size:13px;color:var(--dim);margin:12px 2px 0;
  display:flex;align-items:center;gap:8px;min-height:1.2em;
}
.sheet-note[data-tone="soon"]{color:var(--warn);}
.mini-spin{
  width:13px;height:13px;border-radius:50%;flex:none;
  border:2px solid var(--border);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
.sheet-meta{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0;list-style:none;}
.sheet-meta li{
  font-size:12px;font-weight:600;color:var(--dim);
  background:var(--bg);border:1px solid var(--border);padding:4px 10px;border-radius:999px;
}

@media (min-width:640px){
  #sheet{inset:0;margin:auto;max-height:82dvh;}
  .sheet-inner{border-radius:18px;max-height:82dvh;}
  .grabber{display:none;}
  .sheet-actions{flex-direction:row;}
  .sheet-actions .btn{flex:1;}
}
@media (prefers-reduced-motion: no-preference){
  #sheet[open]{animation:rise .22s cubic-bezier(.2,.8,.3,1);}
  @keyframes rise{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <a class="back" href="https://thejumpvault.com/">&larr; Jump Vault</a>
    <h1>My Apps</h1>
    <p class="lede">Everything we've built that you can use right now — free, and ready in your browser.</p>
  </header>

  <div class="searchbar" id="searchbar">
    <div class="field" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <label for="q" class="sr-only">Search apps</label>
      <input id="q" type="search" placeholder="Search apps" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="Clear search">&times;</button>
    </div>
    <p class="count" id="count" role="status" aria-live="polite"></p>
  </div>

  <ul class="grid" id="grid"></ul>
  <div class="sentinel" id="sentinel" aria-hidden="true"></div>
  <div class="status" id="status"></div>

  <noscript>
    <p style="color:#8B96AC">Search and app details need JavaScript. Direct links:</p>
    <ul><li><a href="puttcount/" style="color:#4C8DFF">Putt Count</a></li></ul>
  </noscript>

  <footer>
    <strong>Jump Vault</strong> — building better experiences for everyone.
    <a href="https://thejumpvault.com/">Home</a> ·
    <a href="https://thejumpvault.com/privacy.html">Privacy</a>
  </footer>
</div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner" id="sheet-inner">
    <div class="grabber" aria-hidden="true"></div>
    <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">&times;</button>

    <div class="sheet-head">
      <div class="chip chip-lg" id="sheet-chip" aria-hidden="true"></div>
      <div>
        <span class="cat" id="sheet-cat"></span>
        <h2 id="sheet-title"></h2>
      </div>
    </div>

    <p class="sheet-desc" id="sheet-desc"></p>

    <div class="sheet-actions">
      <a class="btn btn-primary" id="sheet-open" href="#">Open app</a>
      <span id="sheet-dl-slot"></span>
    </div>

    <p class="sheet-note" id="sheet-note" role="status" aria-live="polite"></p>
    <ul class="sheet-meta" id="sheet-meta"></ul>
  </div>
</dialog>

<script>
/* ══ The app list ══════════════════════════════════════════════════════════
   The only part you edit to add an app.
     name, category, description, url   required
     icon      optional image path; without it you get a lettered chip
     color     chip colour
     offline   shows the green "Works offline" badge
     repo      "owner/name" — enables the download button, which reads the
               repo's latest GitHub Release
     asset     file extension to look for in that release (default ".apk")
   Descriptions marked TODO are placeholders — replace them, and delete the
   demo entries at the bottom.                                            */
const APPS = [
  { name:"Putt Count", category:"Scorekeeping", url:"puttcount/", color:"#3DDC91", offline:true,
    repo:"enachealex/MyApps", asset:".apk",
    description:"A mini golf scorecard for your group. Set the holes, add players, and tap in each putt as you go — running totals, a full scorecard, and past rounds kept on your phone." },

  { name:"Chillist",            category:"Music",     url:"#", color:"#4C8DFF", description:"TODO — one line about Chillist." },
  { name:"Maintenance Tracker", category:"Home",      url:"https://maintenance.thejumpvault.com/", color:"#FFB84C", description:"TODO — one line about Maintenance Tracker." },
  { name:"KeyBuddy",            category:"Utilities", url:"#", color:"#FF5D5D", description:"TODO — one line about KeyBuddy." },
  { name:"RetroBoard",          category:"Teamwork",  url:"#", color:"#A78BFA", description:"TODO — one line about RetroBoard." },
  { name:"Jobs",                category:"Careers",   url:"#", color:"#3DDC91", description:"TODO — one line about Jobs." },
  { name:"Offroad",             category:"Outdoors",  url:"#", color:"#F97316", description:"TODO — one line about Offroad." },
  { name:"Discord Music",       category:"Music",     url:"#", color:"#818CF8", description:"TODO — one line about Discord Music." },

  /* Demo rows — delete once you have real apps. They exist so the
     16-then-6 paging is visible with only one app built. */
  { name:"Demo App 09", category:"Sample", url:"#", color:"#4C8DFF", description:"Placeholder tile." },
  { name:"Demo App 10", category:"Sample", url:"#", color:"#3DDC91", description:"Placeholder tile." },
  { name:"Demo App 11", category:"Sample", url:"#", color:"#FFB84C", description:"Placeholder tile." },
  { name:"Demo App 12", category:"Sample", url:"#", color:"#FF5D5D", description:"Placeholder tile." },
  { name:"Demo App 13", category:"Sample", url:"#", color:"#A78BFA", description:"Placeholder tile." },
  { name:"Demo App 14", category:"Sample", url:"#", color:"#818CF8", description:"Placeholder tile." },
  { name:"Demo App 15", category:"Sample", url:"#", color:"#F97316", description:"Placeholder tile." },
  { name:"Demo App 16", category:"Sample", url:"#", color:"#4C8DFF", description:"Placeholder tile." },
  { name:"Demo App 17", category:"Sample", url:"#", color:"#3DDC91", description:"Placeholder tile." },
  { name:"Demo App 18", category:"Sample", url:"#", color:"#FFB84C", description:"Placeholder tile." },
  { name:"Demo App 19", category:"Sample", url:"#", color:"#FF5D5D", description:"Placeholder tile." },
  { name:"Demo App 20", category:"Sample", url:"#", color:"#A78BFA", description:"Placeholder tile." },
  { name:"Demo App 21", category:"Sample", url:"#", color:"#818CF8", description:"Placeholder tile." },
  { name:"Demo App 22", category:"Sample", url:"#", color:"#F97316", description:"Placeholder tile." },
  { name:"Demo App 23", category:"Sample", url:"#", color:"#4C8DFF", description:"Placeholder tile." },
  { name:"Demo App 24", category:"Sample", url:"#", color:"#3DDC91", description:"Placeholder tile." }
];

const FIRST_BATCH = 16;   // 2 across x 8 down
const NEXT_BATCH  = 6;    // added each time you near the bottom

const grid      = document.getElementById("grid");
const input     = document.getElementById("q");
const clearBtn  = document.getElementById("clear");
const countEl   = document.getElementById("count");
const statusEl  = document.getElementById("status");
const sentinel  = document.getElementById("sentinel");
const searchbar = document.getElementById("searchbar");
const sheet     = document.getElementById("sheet");

let matches = APPS;
let shown   = 0;
let opener  = null;   // tile to hand focus back to on close
let openId  = null;   // guards against a slow fetch landing on the wrong app

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const initialsOf = (n) => n.split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();

/* ── Grid ─────────────────────────────────────────────────────────────── */
function tile(app, index){
  const li = document.createElement("li");
  li.className = "tile";
  li.innerHTML =
    '<div class="chip" style="background:' + esc(app.color || "#4C8DFF") + '" aria-hidden="true">' +
      (app.icon ? '<img src="' + esc(app.icon) + '" alt="" loading="lazy">' : esc(initialsOf(app.name))) +
    '</div>' +
    '<span class="cat">' + esc(app.category) + '</span>' +
    '<h2><button type="button" data-i="' + index + '" aria-haspopup="dialog">' +
      esc(app.name) + '</button></h2>' +
    '<p class="desc">' + esc(app.description) + '</p>' +
    (app.offline ? '<span class="badge">Works offline</span>' : '');
  return li;
}

function renderMore(n){
  const slice = matches.slice(shown, shown + n);
  const frag = document.createDocumentFragment();
  slice.forEach((a) => frag.appendChild(tile(a, APPS.indexOf(a))));
  grid.appendChild(frag);
  shown += slice.length;
  updateStatus();
}

function updateStatus(){
  const total = matches.length;
  countEl.textContent = total === 0 ? ""
    : total === APPS.length ? total + " apps"
    : total + (total === 1 ? " match" : " matches");
  if (total === 0){
    statusEl.innerHTML =
      '<div class="empty"><strong>Nothing matched that</strong>Try a different word, or clear the search.</div>';
  } else if (shown < total){
    statusEl.innerHTML = '<div class="spinner" role="status" aria-label="Loading more apps"></div>';
  } else {
    statusEl.textContent = total > FIRST_BATCH ? "That's everything." : "";
  }
}

function search(query){
  const q = query.trim().toLowerCase();
  matches = !q ? APPS : APPS.filter((a) =>
    (a.name + " " + a.category + " " + a.description).toLowerCase().includes(q));
  grid.replaceChildren();
  shown = 0;
  renderMore(FIRST_BATCH);
  window.scrollTo({ top: 0, behavior: "auto" });
}

let timer;
input.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => search(input.value), 120);
});
clearBtn.addEventListener("click", () => { input.value = ""; search(""); input.focus(); });

if ("IntersectionObserver" in window){
  new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && shown < matches.length) renderMore(NEXT_BATCH);
  }, { rootMargin:"400px 0px" }).observe(sentinel);

  const top = document.createElement("div");
  searchbar.parentNode.insertBefore(top, searchbar);
  new IntersectionObserver(([e]) => {
    searchbar.toggleAttribute("data-stuck", !e.isIntersecting);
  }).observe(top);
}

/* ── Releases ─────────────────────────────────────────────────────────────
   Reads the repo's latest GitHub Release and links the matching asset.
   Cached per page load: the unauthenticated API allows 60 requests an hour
   per IP, so re-opening a sheet must not spend another one.             */
const releaseCache = new Map();
function latestRelease(repo){
  if (releaseCache.has(repo)) return releaseCache.get(repo);
  const p = fetch("https://api.github.com/repos/" + repo + "/releases/latest",
                  { headers:{ Accept:"application/vnd.github+json" } })
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null);
  releaseCache.set(repo, p);
  return p;
}

const fmtSize = (b) =>
  b >= 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
const fmtDate = (iso) => {
  try { return new Date(iso).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" }); }
  catch { return ""; }
};

/* The download control is rebuilt each time: a real <a download> when there
   is something to fetch, a genuinely disabled <button> when there isn't.
   Swapping the element keeps the semantics honest either way. */
function downloadControl({ href, label, disabled }){
  const el = document.createElement(disabled ? "button" : "a");
  el.className = "btn";
  el.innerHTML =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>' +
    '<span>' + esc(label) + '</span>';
  if (disabled){ el.type = "button"; el.disabled = true; }
  else { el.href = href; el.setAttribute("download", ""); el.rel = "noopener"; }
  return el;
}

/* ── The sheet ────────────────────────────────────────────────────────── */
function openSheet(app, fromEl){
  opener = fromEl || null;
  openId = app.name;

  const chip = document.getElementById("sheet-chip");
  chip.style.background = app.color || "#4C8DFF";
  chip.innerHTML = app.icon
    ? '<img src="' + esc(app.icon) + '" alt="">'
    : esc(initialsOf(app.name));

  document.getElementById("sheet-cat").textContent   = app.category;
  document.getElementById("sheet-title").textContent = app.name;
  document.getElementById("sheet-desc").textContent  = app.description;

  const openBtn = document.getElementById("sheet-open");
  const real = app.url && app.url !== "#";
  openBtn.href = real ? app.url : "#";
  openBtn.textContent = real ? "Open app" : "Not published yet";
  openBtn.classList.toggle("btn-primary", !!real);
  openBtn.setAttribute("aria-disabled", real ? "false" : "true");

  const meta = document.getElementById("sheet-meta");
  meta.replaceChildren();
  if (app.offline){
    const li = document.createElement("li");
    li.textContent = "Works offline";
    meta.appendChild(li);
  }

  const slot = document.getElementById("sheet-dl-slot");
  const note = document.getElementById("sheet-note");

  if (!app.repo){
    slot.replaceChildren(downloadControl({ label:"Download", disabled:true }));
    note.dataset.tone = "soon";
    note.textContent = "Release version coming soon.";
  } else {
    slot.replaceChildren(downloadControl({ label:"Download", disabled:true }));
    delete note.dataset.tone;
    note.innerHTML = '<span class="mini-spin"></span><span>Checking for a release…</span>';

    latestRelease(app.repo).then((rel) => {
      if (openId !== app.name) return;            // a different sheet opened meanwhile
      const want = (app.asset || ".apk").toLowerCase();
      const asset = (rel && rel.assets || []).find((a) => a.name.toLowerCase().endsWith(want));

      if (!asset){
        slot.replaceChildren(downloadControl({ label:"Download", disabled:true }));
        note.dataset.tone = "soon";
        note.textContent = "Release version coming soon.";
        return;
      }
      slot.replaceChildren(downloadControl({
        href: asset.browser_download_url,
        label: "Download" + (want === ".apk" ? " for Android" : ""),
        disabled: false
      }));
      delete note.dataset.tone;
      note.textContent = "";
      [rel.tag_name || rel.name, fmtSize(asset.size), fmtDate(rel.published_at)]
        .filter(Boolean)
        .forEach((t) => { const li = document.createElement("li"); li.textContent = t; meta.appendChild(li); });
    });
  }

  document.getElementById("sheet-inner").scrollTop = 0;
  document.body.classList.add("locked");
  if (typeof sheet.showModal === "function") sheet.showModal();
  else sheet.setAttribute("open", "");
}

function closeSheet(){
  openId = null;
  if (typeof sheet.close === "function" && sheet.open) sheet.close();
  else sheet.removeAttribute("open");
}

/* <dialog> fires "close" for Escape as well as our own close() calls, so all
   the cleanup lives here and runs exactly once per dismissal. */
sheet.addEventListener("close", () => {
  document.body.classList.remove("locked");
  if (opener && document.contains(opener)) opener.focus();
  opener = null;
});

/* Tapping the dimmed area: those clicks land on the dialog element itself,
   never on .sheet-inner, which is how we tell outside from inside. */
sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
document.getElementById("sheet-close").addEventListener("click", closeSheet);

/* Tiles open the sheet. No-JS visitors get the <noscript> links instead. */
grid.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-i]");
  if (!btn) return;
  const app = APPS[Number(btn.dataset.i)];
  if (app) openSheet(app, btn);
});

renderMore(FIRST_BATCH);
</script>
</body>
</html>
