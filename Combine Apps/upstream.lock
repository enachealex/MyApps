# The upstream ArtCraft repositories this suite builds, pinned to exact commits.
# scripts/fetch-upstream.ps1 (or .sh) checks each one out under vendor/<name>.
#
# version: the app's release at that commit, or the release it follows (`v0.7.0+`: commits
# after v0.7.0); `-` for the repositories that aren't apps. The Home tab of each window
# compares it with the app's latest release, and its Update button rewrites the line (see
# crates/craft-suite/src/update.rs). To move by hand: change the commit and version, fetch,
# build, and fix the host crate (crates/host-<name>) if the app's startup code changed.
