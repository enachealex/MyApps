[package]
name = "host-designcraft"
description = "DesignCraft as a tab of the ArtCraft suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
craft-suite = { workspace = true }
designcraft-engine = { path = "../../vendor/designcraft/crates/engine" }
designcraft-ui-egui = { path = "../../vendor/designcraft/crates/ui-egui" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
# As in DesignCraft's own workspace.
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
