[package]
name = "host-pdfcraft"
description = "PdfCraft as a tab of the ArtCraft suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
craft-suite = { workspace = true }
pdfcraft-ui-egui = { path = "../../vendor/pdfcraft/crates/ui-egui" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11", "links"] }
log = { workspace = true }
serde_json = { workspace = true }
# As in PdfCraft's own app (apps/pdfcraft/Cargo.toml): Help ▸ Check for updates (`updates`), one
# HTTPS request to GitHub over rustls with the OS's trusted roots.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows' Animation effects setting (`motion`), as in PdfCraft's own app.
windows = { version = "0.62", default-features = false, features = ["std", "UI_ViewManagement"] }
