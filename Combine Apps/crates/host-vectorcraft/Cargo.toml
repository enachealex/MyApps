[package]
name = "host-vectorcraft"
description = "VectorCraft as a tab of the ArtCraft suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
craft-suite = { workspace = true }
vectorcraft-engine = { path = "../../vendor/vectorcraft/crates/engine" }
vectorcraft-text = { path = "../../vendor/vectorcraft/crates/text" }
vectorcraft-ui-egui = { path = "../../vendor/vectorcraft/crates/ui-egui" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
# As in VectorCraft's own workspace and app.
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = "0.17"
# wayland-data-control: native Wayland clipboard (Linux; X11 through XWayland only sees what X11 apps copied).
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
webbrowser = "1"
# The window file dialogs belong to (the same winit eframe runs on).
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSMenu", "NSEvent", "NSPasteboard", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSTextField", "NSTextInputContext", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL"] }
# Waits for the answer of a file dialog shown as a sheet.
pollster = "1"
