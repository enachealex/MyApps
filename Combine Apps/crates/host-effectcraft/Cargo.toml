[package]
name = "host-effectcraft"
description = "EffectCraft as a tab of the ArtCraft suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
craft-suite = { workspace = true }
effectcraft-engine = { path = "../../vendor/effectcraft/crates/engine" }
effectcraft-host = { path = "../../vendor/effectcraft/crates/host" }
effectcraft-ui-egui = { path = "../../vendor/effectcraft/crates/ui-egui" }
# `links`: links (Help menu, Discord, Settings) open in the system browser, as in EffectCraft.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11", "links"] }
egui = { workspace = true }
log = { workspace = true }
# As in EffectCraft's own workspace.
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = "0.17"
cpal = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with System: the XDG desktop portal's colour scheme (appearance.rs).
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
# Non-blocking file dialogs (sheet_dialogs.rs).
pollster = "0.4"
# NSApplication hide / hide others / show all (app ▸ Hide EffectCraft…).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard"] }
