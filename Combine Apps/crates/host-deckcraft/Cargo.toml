[package]
name = "host-deckcraft"
description = "DeckCraft as a tab of the ArtCraft suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
craft-suite = { workspace = true }
deckcraft-engine = { path = "../../vendor/deckcraft/crates/engine" }
deckcraft-ui-egui = { path = "../../vendor/deckcraft/crates/ui-egui" }
deckcraft-media = { path = "../../vendor/deckcraft/crates/media" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11", "links"] }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
# As in DeckCraft's own workspace.
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
cpal = "0.16"
