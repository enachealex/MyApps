[package]
name = "host-soundcraft"
description = "SoundCraft as a tab of the ArtCraft suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
craft-suite = { workspace = true }
soundcraft-engine = { path = "../../vendor/soundcraft/crates/engine" }
soundcraft-playback = { path = "../../vendor/soundcraft/crates/playback" }
soundcraft-ui-egui = { path = "../../vendor/soundcraft/crates/ui-egui" }
# `links`: Help links open in the system browser, as in SoundCraft.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11", "links"] }
egui = { workspace = true }
log = { workspace = true }
# As in SoundCraft's own workspace.
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
