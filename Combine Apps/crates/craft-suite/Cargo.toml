[package]
name = "craft-suite"
description = "Runs several ArtCraft apps in one window, one title-bar tab each"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11"] }
egui = { workspace = true }
image = { workspace = true }
log = { workspace = true }
ron = { workspace = true }

# Safe Win32 wrappers for the borderless-window guard (`window_frame.rs`); the same pinned version
# PhotoCraft uses for the same job.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }
