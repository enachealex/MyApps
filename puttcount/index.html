<style>
:root{
  --felt-900:#08301F; --felt-800:#0D4029; --felt-700:#125437;
  --line:rgba(241,240,228,0.16);
  --paper:#F6F4E9; --paper-2:#EAE7D6;
  --ink:#0E2A1D; --ink-soft:#5C6F63;
  --flag:#E4572E; --sun:#F2C14E;
  --disp:'Alfa Slab One', Georgia, 'Times New Roman', serif;
  --body:'Barlow', system-ui, -apple-system, sans-serif;
  --cond:'Barlow Semi Condensed','Barlow', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body); color:var(--paper);
  background:
    radial-gradient(circle at 1px 1px, rgba(241,240,228,0.055) 1px, transparent 1.6px) 0 0/9px 9px,
    linear-gradient(170deg, var(--felt-700), var(--felt-900) 70%);
  background-attachment:fixed;
  min-height:100vh; min-height:100dvh;
  padding:calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px;margin:0 auto;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px;}

.mast{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.mast h1{font-family:var(--disp);font-size:23px;line-height:1;margin:0;letter-spacing:-0.01em;}
.mast p{margin:4px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,244,233,.5);}
.mark{width:42px;height:42px;border-radius:50%;flex:none;background:var(--sun);color:var(--felt-900);
  display:grid;place-items:center;font-family:var(--disp);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.28);}

.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.22);}
.lbl{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;}
.lbl-light{color:rgba(246,244,233,.55);}

.step{display:flex;align-items:center;gap:12px;}
.step-btn{width:46px;height:46px;border-radius:12px;flex:none;background:var(--paper-2);color:var(--ink);
  font-size:24px;font-weight:600;line-height:1;display:grid;place-items:center;transition:transform .1s ease;}
.step-btn:active{transform:scale(.92);}
.step-btn:disabled{opacity:.35;cursor:not-allowed;}
.step-val{font-family:var(--disp);font-size:34px;min-width:60px;text-align:center;line-height:1;}
.step-val.sm{font-size:20px;}
.presets{display:flex;gap:8px;margin-left:auto;}
.chip{padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--paper-2);color:var(--ink-soft);}
.chip[data-on="true"]{background:var(--felt-700);color:var(--paper);}

.prow{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.ball{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset -3px -4px 0 rgba(0,0,0,.17),0 2px 0 rgba(0,0,0,.2);}
.ball.sm{width:22px;height:22px;box-shadow:inset -2px -3px 0 rgba(0,0,0,.17);}
.inp{flex:1;min-width:0;font-family:var(--body);font-size:16px;font-weight:600;padding:11px 12px;
  border-radius:10px;border:2px solid var(--paper-2);background:#fff;color:var(--ink);}
.inp::placeholder{color:#A9B3AC;font-weight:500;}
.x{width:36px;height:36px;flex:none;border-radius:10px;color:var(--ink-soft);font-size:20px;display:grid;place-items:center;}
.x:hover{background:var(--paper-2);color:var(--flag);}
.x:disabled{opacity:.3;}
.add{width:100%;padding:12px;border-radius:10px;font-weight:600;font-size:15px;border:2px dashed #C9C7B5;color:var(--ink-soft);margin-top:4px;}
.add:hover{border-color:var(--felt-700);color:var(--felt-700);}

.go{width:100%;padding:17px;border-radius:14px;background:var(--flag);color:#fff;font-family:var(--disp);
  font-size:19px;box-shadow:0 5px 0 #A93A1C;transition:transform .08s ease, box-shadow .08s ease;}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #A93A1C;}
.go:disabled{background:#8C9A91;box-shadow:0 5px 0 #6B776F;cursor:not-allowed;}
.ghost{width:100%;padding:13px;border-radius:12px;font-weight:600;font-size:15px;border:2px solid var(--line);color:rgba(246,244,233,.8);}
.ghost:hover{border-color:var(--sun);color:var(--sun);}
.mt{margin-top:10px;}

.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:12px;scrollbar-width:none;}
.strip::-webkit-scrollbar{height:0;}
.pin{flex:none;width:36px;height:40px;border-radius:9px;background:rgba(241,240,228,.09);color:rgba(246,244,233,.6);
  font-family:var(--cond);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.pin i{width:5px;height:5px;border-radius:50%;background:transparent;display:block;}
.pin[data-done="true"] i{background:var(--sun);}
.pin[data-now="true"]{background:var(--paper);color:var(--ink);}
.pin[data-now="true"] i{background:var(--flag);}

.hole{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.nav{width:44px;height:44px;border-radius:12px;flex:none;background:rgba(241,240,228,.1);font-size:20px;display:grid;place-items:center;}
.nav:disabled{opacity:.25;cursor:not-allowed;}
.hole-mid{flex:1;text-align:center;}
.hole-num{font-family:var(--disp);font-size:44px;line-height:.95;color:var(--sun);}
.hole-of{font-family:var(--cond);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(246,244,233,.5);}

.score{display:flex;align-items:center;gap:12px;padding:12px 0;}
.score + .score{border-top:1px solid var(--paper-2);}
.who{flex:1;min-width:0;}
.pname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.ace{font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:.12em;background:var(--sun);color:var(--ink);padding:2px 5px;border-radius:4px;}
.tally{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px;min-height:9px;}
.dot{width:9px;height:9px;border-radius:50%;}
.tot{font-family:var(--cond);font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:6px;}
.minus{width:40px;height:40px;border-radius:11px;flex:none;background:var(--paper-2);color:var(--ink-soft);font-size:22px;display:grid;place-items:center;}
.minus:disabled{opacity:.3;cursor:not-allowed;}
.count{font-family:var(--disp);font-size:30px;min-width:34px;text-align:center;line-height:1;}
.count[data-zero="true"]{color:#C2C7C0;}
.plus{width:56px;height:56px;border-radius:50%;flex:none;color:var(--felt-900);font-size:28px;font-weight:700;line-height:1;
  display:grid;place-items:center;box-shadow:inset -4px -6px 0 rgba(0,0,0,.16),0 3px 0 rgba(0,0,0,.25);
  transition:transform .09s ease, box-shadow .09s ease;}
.plus:active{transform:translateY(3px);box-shadow:inset -4px -6px 0 rgba(0,0,0,.16),0 0 0 rgba(0,0,0,.25);}
.plus:disabled{opacity:.4;cursor:not-allowed;}
.cap{font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--flag);margin-top:5px;}

.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;}
.lpos{font-family:var(--cond);font-weight:700;width:18px;color:rgba(246,244,233,.45);}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.lscore{font-family:var(--disp);font-size:20px;}
.lthru{font-family:var(--cond);font-size:12px;color:rgba(246,244,233,.45);letter-spacing:.08em;}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;font-size:14px;width:100%;}
th,td{padding:8px 6px;text-align:center;white-space:nowrap;}
thead th{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);border-bottom:2px solid var(--paper-2);}
tbody td{border-bottom:1px solid var(--paper-2);font-weight:600;}
.sticky{position:sticky;left:0;background:var(--paper);text-align:left !important;padding-right:12px !important;z-index:1;}
.tot-col{font-family:var(--disp);font-size:16px;}
.blank{color:#C7CCC5;}
.cellname{display:flex;align-items:center;gap:7px;}

.win{text-align:center;padding:22px 16px;}
.win-eyebrow{font-family:var(--cond);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);}
.win-name{font-family:var(--disp);font-size:32px;line-height:1.1;margin:8px 0 4px;color:var(--felt-800);}
.win-score{font-family:var(--cond);font-size:15px;font-weight:600;color:var(--ink-soft);}
.win-balls{display:flex;justify-content:center;gap:6px;margin-top:14px;}

.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;border-top:1px solid var(--line);}
.hrow:first-of-type{border-top:none;}
.hdate{font-family:var(--cond);font-size:12px;color:rgba(246,244,233,.45);letter-spacing:.06em;}
.hname{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.clear{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,244,233,.45);}
.clear:hover{color:var(--flag);}
.histhead{display:flex;align-items:baseline;justify-content:space-between;}
.foot{text-align:center;font-size:12px;color:rgba(246,244,233,.35);margin-top:20px;}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none !important;animation:none !important;}}
</style>
</head>

var KEY = "puttcount:v1";
var COLORS = ["#E4572E","#F2C14E","#3FA9D9","#C46BAF","#5BC0A0","#EFEFE6","#9B7EDE","#E8A33D"];

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function sum(a){ return a.reduce(function(x,y){return x+y;},0); }
function done(a){ return a.filter(function(n){return n>0;}).length; }

var state = {
  view:"setup", holes:18, limit:6,
  roster:[{id:uid(),name:"",color:COLORS[0]},{id:uid(),name:"",color:COLORS[1]}],
  round:null, history:[]
};

try {
  var saved = localStorage.getItem(KEY);
  if (saved) {
    var p = JSON.parse(saved);
    if (p && typeof p === "object") {
      for (var k in state) { if (p[k] !== undefined && p[k] !== null) state[k] = p[k]; }
    }
  }
} catch(e){}

var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }, 250);
}

function standings(r){
  return r.players.map(function(p){
    return { id:p.id, name:p.name, color:p.color,
             total:sum(r.scores[p.id]), thru:done(r.scores[p.id]) };
  }).sort(function(a,b){ return (a.total-b.total) || (b.thru-a.thru); });
}

/* ---------- views ---------- */

function vSetup(){
  var h = "";
  if (state.round) {
    h += '<button class="go" data-act="resume" style="margin-bottom:14px">Back to the round in play</button>';
  }

  h += '<div class="card"><p class="lbl">Holes on the course</p><div class="step">'
    + '<button class="step-btn" data-act="holes" data-d="-1"' + (state.holes<=1?" disabled":"") + ' aria-label="One fewer hole">&minus;</button>'
    + '<div class="step-val">' + state.holes + '</div>'
    + '<button class="step-btn" data-act="holes" data-d="1"' + (state.holes>=36?" disabled":"") + ' aria-label="One more hole">+</button>'
    + '<div class="presets">'
    + '<button class="chip" data-act="holeset" data-n="9" data-on="' + (state.holes===9) + '">9</button>'
    + '<button class="chip" data-act="holeset" data-n="18" data-on="' + (state.holes===18) + '">18</button>'
    + '</div></div></div>';

  h += '<div class="card"><p class="lbl">Putt limit per hole</p><div class="step">'
    + '<button class="step-btn" data-act="limit" data-d="-1"' + (state.limit<=0?" disabled":"") + ' aria-label="Lower the limit">&minus;</button>'
    + '<div class="step-val' + (state.limit===0?" sm":"") + '">' + (state.limit===0?"None":state.limit) + '</div>'
    + '<button class="step-btn" data-act="limit" data-d="1"' + (state.limit>=12?" disabled":"") + ' aria-label="Raise the limit">+</button>'
    + '<div class="presets">'
    + '<button class="chip" data-act="limitset" data-n="0" data-on="' + (state.limit===0) + '">No cap</button>'
    + '<button class="chip" data-act="limitset" data-n="6" data-on="' + (state.limit===6) + '">6</button>'
    + '</div></div></div>';

  h += '<div class="card"><p class="lbl">Players &mdash; tap a ball to change its colour</p>';
  state.roster.forEach(function(p,i){
    h += '<div class="prow">'
      + '<button class="ball" style="background:' + p.color + '" data-act="color" data-id="' + p.id + '" aria-label="Change colour for player ' + (i+1) + '"></button>'
      + '<input class="inp" maxlength="16" data-name="' + p.id + '" value="' + esc(p.name) + '" placeholder="Player ' + (i+1) + '">'
      + '<button class="x" data-act="remove" data-id="' + p.id + '"' + (state.roster.length<=1?" disabled":"") + ' aria-label="Remove player ' + (i+1) + '">&times;</button>'
      + '</div>';
  });
  if (state.roster.length < 8) h += '<button class="add" data-act="addp">Add a player</button>';
  h += '</div>';

  h += '<button class="go" data-act="start">Start the round</button>';

  if (state.history.length) {
    h += '<div style="margin-top:26px"><div class="histhead"><p class="lbl lbl-light">Past rounds</p>'
       + '<button class="clear" data-act="clearhist">Clear</button></div>';
    state.history.forEach(function(r){
      h += '<div class="hrow"><span class="ball sm" style="background:' + r.winnerColor + '"></span>'
        + '<span class="hname">' + esc(r.winner) + '</span>'
        + '<span class="hdate">' + r.winnerScore + ' &middot; ' + r.holes + ' holes &middot; '
        + new Date(r.date).toLocaleDateString() + '</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function vPlay(){
  var r = state.round, i = r.hole, cap = r.limit > 0 ? r.limit : null;
  var last = i === r.holes - 1;
  var allIn = r.players.every(function(p){ return r.scores[p.id][i] > 0; });

  var h = '<div class="strip">';
  for (var n = 0; n < r.holes; n++) {
    var full = r.players.every(function(p){ return r.scores[p.id][n] > 0; });
    h += '<button class="pin" data-act="goto" data-i="' + n + '" data-done="' + full + '" data-now="' + (n===i) + '" aria-label="Go to hole ' + (n+1) + '">' + (n+1) + '<i></i></button>';
  }
  h += '</div>';

  h += '<div class="hole">'
    + '<button class="nav" data-act="goto" data-i="' + (i-1) + '"' + (i===0?" disabled":"") + ' aria-label="Previous hole">&lsaquo;</button>'
    + '<div class="hole-mid"><div class="hole-num">' + (i+1) + '</div>'
    + '<div class="hole-of">Hole ' + (i+1) + ' of ' + r.holes + '</div></div>'
    + '<button class="nav" data-act="goto" data-i="' + (i+1) + '"' + (last?" disabled":"") + ' aria-label="Next hole">&rsaquo;</button></div>';

  h += '<div class="card">';
  r.players.forEach(function(p){
    var v = r.scores[p.id][i], atCap = cap !== null && v >= cap, dots = "";
    for (var d = 0; d < Math.min(v,12); d++) dots += '<span class="dot" style="background:' + p.color + '"></span>';
    h += '<div class="score">'
      + '<button class="minus" data-act="bump" data-id="' + p.id + '" data-d="-1"' + (v===0?" disabled":"") + ' aria-label="Remove a putt for ' + esc(p.name) + '">&minus;</button>'
      + '<div class="who"><div class="pname"><span class="ball sm" style="background:' + p.color + '"></span>'
      + esc(p.name) + (v===1 ? '<span class="ace">Ace</span>' : '') + '</div>'
      + '<div class="tally">' + dots + '</div>'
      + '<div class="tot">Total ' + sum(r.scores[p.id]) + ' &middot; thru ' + done(r.scores[p.id]) + '</div>'
      + (atCap ? '<div class="cap">Putt limit reached</div>' : '')
      + '</div>'
      + '<div class="count" data-zero="' + (v===0) + '">' + (v || "&ndash;") + '</div>'
      + '<button class="plus" style="background:' + p.color + '" data-act="bump" data-id="' + p.id + '" data-d="1"' + (atCap?" disabled":"") + ' aria-label="Add a putt for ' + esc(p.name) + '">+</button>'
      + '</div>';
  });
  h += '</div>';

  if (!last) {
    h += '<button class="go" data-act="goto" data-i="' + (i+1) + '"' + (allIn?"":" disabled") + '>'
       + (allIn ? "Next hole" : "Enter every putt to move on") + '</button>';
  } else {
    h += '<button class="go" data-act="finish"' + (allIn?"":" disabled") + '>'
       + (allIn ? "Finish the round" : "Enter every putt to finish") + '</button>';
  }
  h += '<div class="mt"><button class="ghost" data-act="opencard">See the full card</button></div>';

  h += '<div style="margin-top:26px"><p class="lbl lbl-light">Standing</p>';
  standings(r).forEach(function(p,n){
    h += '<div class="lrow"><span class="lpos">' + (n+1) + '</span>'
      + '<span class="ball sm" style="background:' + p.color + '"></span>'
      + '<span class="lname">' + esc(p.name) + '</span>'
      + '<span class="lthru">thru ' + p.thru + '</span>'
      + '<span class="lscore">' + p.total + '</span></div>';
  });
  h += '</div>';
  return h;
}

function table(r, rows){
  var h = '<div class="scroll"><table><thead><tr><th class="sticky">Player</th>';
  for (var i = 0; i < r.holes; i++) h += '<th>' + (i+1) + '</th>';
  h += '<th>Tot</th></tr></thead><tbody>';
  rows.forEach(function(p){
    h += '<tr><td class="sticky"><span class="cellname"><span class="ball sm" style="background:' + p.color + '"></span>' + esc(p.name) + '</span></td>';
    r.scores[p.id].forEach(function(n){
      h += '<td' + (n===0?' class="blank"':'') + '>' + (n || "&middot;") + '</td>';
    });
    h += '<td class="tot-col">' + sum(r.scores[p.id]) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function vCard(){
  var r = state.round;
  return '<div class="card"><p class="lbl">The card</p>' + table(r, r.players) + '</div>'
    + '<button class="go" data-act="back">Back to hole ' + (r.hole+1) + '</button>'
    + '<div class="mt"><button class="ghost" data-act="finish">Finish the round now</button></div>';
}

function vDone(){
  var r = state.round, board = standings(r), best = board[0].total;
  var winners = board.filter(function(p){ return p.total === best; });
  var aces = r.players.reduce(function(t,p){
    return t + r.scores[p.id].filter(function(n){ return n === 1; }).length; }, 0);

  var h = '<div class="card win">'
    + '<div class="win-eyebrow">' + (winners.length>1 ? "It&rsquo;s a tie" : "Winner") + '</div>'
    + '<div class="win-name">' + winners.map(function(w){ return esc(w.name); }).join(" &amp; ") + '</div>'
    + '<div class="win-score">' + best + ' putts over ' + r.holes + ' holes'
    + (aces > 0 ? ' &middot; ' + aces + (aces===1 ? ' ace' : ' aces') : '') + '</div>'
    + '<div class="win-balls">' + winners.map(function(w){
        return '<span class="ball" style="background:' + w.color + '"></span>'; }).join("") + '</div></div>';

  h += '<div class="card"><p class="lbl">Final card</p>' + table(r, board) + '</div>';
  h += '<button class="go" data-act="again">Play again, same players</button>';
  h += '<div class="mt"><button class="ghost" data-act="fresh">Set up a new group</button></div>';
  return h;
}

var app = document.getElementById("app");
function render(){
  var v = state.view;
  if ((v === "play" || v === "card" || v === "done") && !state.round) v = state.view = "setup";
  app.innerHTML = v === "play" ? vPlay() : v === "card" ? vCard() : v === "done" ? vDone() : vSetup();
}

/* ---------- actions ---------- */

function startRound(){
  var players = state.roster.map(function(p,i){
    return { id:p.id, name:(p.name||"").trim() || ("Player " + (i+1)), color:p.color };
  });
  var scores = {};
  players.forEach(function(p){ scores[p.id] = new Array(state.holes).fill(0); });
  state.round = { id:uid(), date:Date.now(), holes:state.holes, limit:state.limit,
                  players:players, scores:scores, hole:0 };
  state.view = "play";
}

function finish(){
  var r = state.round, board = standings(r);
  state.history.unshift({
    id:r.id, date:r.date, holes:r.holes,
    winner:board[0].name, winnerColor:board[0].color, winnerScore:board[0].total
  });
  state.history = state.history.slice(0,8);
  state.view = "done";
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var act = el.dataset.act, r = state.round;

  if (act === "holes")    state.holes = Math.max(1, Math.min(36, state.holes + (+el.dataset.d)));
  else if (act === "holeset") state.holes = +el.dataset.n;
  else if (act === "limit")   state.limit = Math.max(0, Math.min(12, state.limit + (+el.dataset.d)));
  else if (act === "limitset") state.limit = +el.dataset.n;
  else if (act === "addp") {
    if (state.roster.length < 8)
      state.roster.push({ id:uid(), name:"", color:COLORS[state.roster.length % COLORS.length] });
  }
  else if (act === "remove") {
    if (state.roster.length > 1)
      state.roster = state.roster.filter(function(p){ return p.id !== el.dataset.id; });
  }
  else if (act === "color") {
    state.roster = state.roster.map(function(p){
      if (p.id !== el.dataset.id) return p;
      return { id:p.id, name:p.name, color:COLORS[(COLORS.indexOf(p.color) + 1) % COLORS.length] };
    });
  }
  else if (act === "start")  startRound();
  else if (act === "resume") state.view = "play";
  else if (act === "bump") {
    var cap = r.limit > 0 ? r.limit : 99;
    var arr = r.scores[el.dataset.id];
    arr[r.hole] = Math.max(0, Math.min(cap, arr[r.hole] + (+el.dataset.d)));
    if (navigator.vibrate && +el.dataset.d > 0) navigator.vibrate(8);
  }
  else if (act === "goto") {
    r.hole = Math.max(0, Math.min(r.holes - 1, +el.dataset.i));
    window.scrollTo({ top:0, behavior:"smooth" });
  }
  else if (act === "opencard") state.view = "card";
  else if (act === "back")     state.view = "play";
  else if (act === "finish")   finish();
  else if (act === "again") {
    state.roster = r.players.map(function(p){ return { id:uid(), name:p.name, color:p.color }; });
    state.round = null; state.view = "setup";
  }
  else if (act === "fresh") { state.round = null; state.view = "setup"; }
  else if (act === "clearhist") state.history = [];

  save(); render();
});

app.addEventListener("input", function(e){
  var id = e.target.dataset.name;
  if (!id) return;
  state.roster = state.roster.map(function(p){
    return p.id === id ? { id:p.id, name:e.target.value, color:p.color } : p;
  });
  save(); // no re-render, keeps the keyboard and cursor in place
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
</body>
</html>
