<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B5FC7" />
    <meta name="description" content="On-call schedule, phone list, and shift trades for surgical services." />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS ignores the manifest's icons and reads this one, and it will not
         take an SVG. Without it an iPhone home screen shows a screenshot of
         the page instead of the mark. Relative, because the app is served from
         a subpath. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>OnCall Schedule</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
