name: Build Android APK

# Run this from your phone: repo -> Actions tab -> "Build Android APK"
# -> "Run workflow". No computer, no Android SDK, nothing installed locally.
# GitHub's Ubuntu runners already ship the Android SDK and Gradle.

on:
  workflow_dispatch:
    inputs:
      app_folder:
        description: "Folder holding the web app (must contain index.html)"
        required: true
        default: "puttcount"
      version_name:
        description: "Version shown in Android settings"
        required: false
        default: "1.0"

# Attaching the APK to a Release needs write access to contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7 needs JDK 21. If a future Capacitor bumps this again,
      # the Gradle step is where it will fail, and the error names the version.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the app folder exists
        run: |
          set -e
          APP="${{ github.event.inputs.app_folder }}"
          if [ ! -f "$APP/index.html" ]; then
            echo "::error::No index.html in '$APP/'. Check the folder name you entered."
            exit 1
          fi
          echo "Building from $APP/"
          ls -la "$APP"

      - name: Stage the web assets
        run: |
          set -e
          mkdir -p www
          cp -r "${{ github.event.inputs.app_folder }}"/. www/
          ls -la www
          # @capacitor/assets reads assets/ from the repo root, but each app
          # keeps its own icon and splash alongside its index.html.
          if [ -d "${{ github.event.inputs.app_folder }}/assets" ]; then
            cp -r "${{ github.event.inputs.app_folder }}/assets" assets
            ls -la assets
          fi

      - name: Install Capacitor
        run: |
          set -e
          npm init -y >/dev/null
          npm install --no-fund --no-audit @capacitor/core@^7 @capacitor/android@^7
          npm install --no-fund --no-audit -D @capacitor/cli@^7 @capacitor/assets@^3

      - name: Write Capacitor config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.thejumpvault.puttcount",
            "appName": "Putt Count",
            "webDir": "www",
            "android": { "backgroundColor": "#08301F" },
            "server": { "androidScheme": "https" }
          }
          JSON
          cat capacitor.config.json

      - name: Create the Android project
        run: npx cap add android

      - name: Generate launcher icons and splash screens
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android \
              --iconBackgroundColor '#08301F' \
              --splashBackgroundColor '#08301F'
          else
            echo "No assets/icon.png — Capacitor's default icon will be used."
          fi

      - name: Set the version name
        run: |
          set -e
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version_name }}\"/" \
            android/app/build.gradle
          grep versionName android/app/build.gradle

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the output
        id: out
        run: |
          set -e
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          DEST="putt-count-${{ github.event.inputs.version_name }}.apk"
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      # The artifact is a .zip, which is awkward to open on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: putt-count-apk
          path: ${{ steps.out.outputs.apk }}
          retention-days: 30

      # This is the one you want on mobile: a Release attaches the .apk as a
      # direct download, so tapping it on Android installs straight away.
      - name: Publish a Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.event.inputs.version_name }}-${{ github.run_number }}
          name: Putt Count ${{ github.event.inputs.version_name }}
          body: |
            Debug build of Putt Count, built from `${{ github.event.inputs.app_folder }}/`.

            Tap the `.apk` below on your Android phone to install. You'll be asked
            to allow installs from this source the first time.

            Unsigned debug build — fine for testing and sideloading, not for the
            Play Store.
          files: ${{ steps.out.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
