name: Build Android APK

# Produces a sideloadable debug APK on every push, and a signed release APK
# when run manually with signing secrets configured.
on:
  push:
    branches: [main]
    paths:
      - "oncall/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oncall
    steps:
      - uses: actions/checkout@v7

      # The Capacitor 8 CLI refuses to run on anything below Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oncall/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install
        run: npm ci

      - name: Build web bundle for native
        run: npm run build:app

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Assemble debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: oncall-debug-apk
          path: oncall/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
