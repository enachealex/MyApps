name: Deploy OnCall

# Builds oncall/ and publishes it to the gh-pages branch under /oncall.
# keep_files: true means other apps you add to this repo later won't be wiped.
on:
  push:
    branches: [main]
    paths:
      - "oncall/**"
      - ".github/workflows/deploy-oncall.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oncall/package-lock.json

      - name: Install
        working-directory: oncall
        run: npm ci

      - name: Build
        working-directory: oncall
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: oncall/dist
          destination_dir: oncall
          keep_files: true
