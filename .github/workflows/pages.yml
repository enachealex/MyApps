name: Deploy site

# Publishes the whole site to https://myapps.thejumpvault.com/:
#
#   /             the My Apps landing page (index.html)
#   /puttcount/   a standalone HTML app, copied as-is
#   /oncall/      a Vite app, built here
#   /my-tasks/    an Expo (React Native web) PWA, built here; its baseUrl
#                 is set to /my-tasks in my-tasks/app.json
#
# Pages for this repo is set to "GitHub Actions" as its build type, so a
# deployment only happens through actions/deploy-pages below. Pushing a
# gh-pages branch does nothing.
#
# Adding another static app: copy it into _site in the assemble step.
# Adding another built app: add a build step, then copy its dist into _site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            oncall/package-lock.json
            my-tasks/package-lock.json

      # One secret, holding the JSON object Firebase shows when you register a
      # web app. Present: the build wires up Firebase Auth. Absent: it stays on
      # the local demo, which is the safe failure but an easy one to miss —
      # check the sign-in screen for "Forgot password?" after deploying, since
      # that only appears on a live build.
      # See oncall/docs/firebase-setup.md.
      - name: Build OnCall
        working-directory: oncall
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          npm ci
          npm run build

      - name: Build My Tasks
        working-directory: my-tasks
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npm ci
          npx expo export --platform web

      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/index.html
          cp -r icons _site/icons
          cp -r puttcount _site/puttcount
          cp -r oncall/dist _site/oncall
          cp -r my-tasks/dist _site/my-tasks
          # Without .nojekyll, Pages drops files and folders beginning with an
          # underscore — which is what Vite names some chunks.
          touch _site/.nojekyll
          # Keeps the custom domain attached across deployments.
          echo 'myapps.thejumpvault.com' > _site/CNAME
          find _site -maxdepth 2

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
